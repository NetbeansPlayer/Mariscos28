<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificación Digital Simulada</title>

    <!-- Fuente y estilos generales -->
    <link rel="stylesheet" href="../assets/css/styles3.css">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            padding: 0;
            margin: 0;
        }

        .cert-container {
            max-width: 750px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 12px;
            text-align: center;
        }

        .cert-container h1 {
            font-size: 2rem;
            color: #004085;
            margin-bottom: 10px;
        }

        .cert-container h2 {
            color: #333;
        }

        .cert-text {
            margin-top: 25px;
            font-size: 1.1rem;
            color: #555;
            line-height: 1.7;
        }

        .btn-regresar {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 22px;
            background: #1e90ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s ease;
        }

        .btn-regresar:hover {
            background: #0066cc;
        }
    </style>
</head>

<body>

    <div class="cert-container">
        <h1>Certificación Digital Simulada</h1>
        <h2>Mariscos “El 28”</h2>

        <p class="cert-text">
            Este sitio implementa un sistema de <strong>certificación digital simulada</strong> 
            con fines educativos para reforzar la confianza del usuario.
            <br><br>
            No tiene validez oficial y es únicamente parte del proyecto académico.
        </p>

        <a href="../../index.html" class="btn-regresar">⟵ Regresar al inicio</a>
    </div>

</body>
</html>
